<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Ingresar · CRM</title>
    <link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body class="login-page">
    <main class="login-card">
        <h1>CRM</h1>
        <p class="muted">Consultoría Especializada</p>
        <form id="login-form">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
            <button type="submit" class="btn btn-primary">Ingresar</button>
            <p id="login-error" class="form-error" role="alert" hidden></p>
        </form>
    </main>
    <script>
        document.getElementById('login-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const error = document.getElementById('login-error');
            const button = this.querySelector('button');
            button.disabled = true;
            error.hidden = true;
            try {
                const res = await fetch('/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: this.password.value })
                });
                if (res.ok) {
                    location.href = '/admin' + location.hash;
                    return;
                }
                const data = await res.json().catch(() => ({}));
                error.textContent = data.message || 'No se pudo iniciar sesión.';
            } catch {
                error.textContent = 'No se pudo conectar con el servidor.';
            }
            error.hidden = false;
            button.disabled = false;
        });
    </script>
</body>
</html>
